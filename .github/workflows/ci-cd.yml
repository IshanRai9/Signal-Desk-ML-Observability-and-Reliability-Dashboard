name: verify-build-deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.2'
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest --cov=signaldesk --cov=dashboard.data --cov-report=xml
      - run: uv run python -m signaldesk.cli bootstrap
      - run: uv run playwright install --with-deps chromium
      - name: Browser smoke test
        run: |
          uv run uvicorn signaldesk.api:app --port 8000 &
          api_pid=$!
          uv run streamlit run dashboard/app.py --server.port 8501 &
          dashboard_pid=$!
          # Release uv's cache locks before setup-uv's post-job cache pruning.
          trap 'kill "$api_pid" "$dashboard_pid" 2>/dev/null || true; wait "$api_pid" "$dashboard_pid" 2>/dev/null || true' EXIT
          uv run python scripts/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            coverage.xml
            docs/screenshots/*.png

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: signaldesk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test
        run: |
          docker run --rm signaldesk:ci python -m signaldesk.cli bootstrap
          IMAGE=signaldesk:ci docker compose up -d --wait api monitor dashboard
          curl --retry 10 --retry-delay 2 --retry-connrefused --fail http://localhost:8000/readyz
          curl --fail http://localhost:8501/_stcore/health
          docker compose logs
          docker compose down
      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}
          cache-from: type=gha

  deploy:
    # Opt in only after provisioning a private Linux runner, Docker and registry pull access.
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: image
    runs-on: [self-hosted, linux, signaldesk]
    environment: production
    concurrency:
      group: signaldesk-production
      cancel-in-progress: false
    env:
      IMAGE: ${{ needs.image.outputs.image }}
      API_KEY: ${{ secrets.PRODUCTION_API_KEY }}
      SEED_DEMO: 'false'
      COMPOSE_PROJECT_NAME: signaldesk-production
    steps:
      - uses: actions/checkout@v4
      - name: Require production authentication
        run: test -n "$API_KEY"
      - name: Deploy immutable image
        run: |
          docker compose pull
          docker compose up -d --no-build --wait api monitor dashboard
          curl --retry 10 --retry-delay 2 --retry-connrefused --fail http://localhost:8000/readyz
          curl --fail http://localhost:8501/_stcore/health
