[project]
name = "signaldesk"
version = "1.0.0"
description = "An observable support-ticket classifier with delayed-label monitoring"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "numpy>=2.2,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2", "streamlit>=1.45,<2", "plotly>=6,<7",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<8", "ruff>=0.11,<1", "playwright>=1.51,<2"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
